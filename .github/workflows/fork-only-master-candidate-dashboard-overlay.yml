name: fork-only-cva6-pages-dashboard-publisher

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fork-only-master-candidate-dashboard-overlay.yml
  workflow_run:
    workflows:
      - openhw-cva6-ci-tier1
      - openhw-cva6-ci-tier2
    types:
      - completed
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: fork-only-master-candidate-dashboard-overlay
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  DASHBOARD_SOURCE_SHA: 6464894fa0709630c09ea0414691358aec4fa9e7
  TIER_BRANCH: jchen/master-candidate-openhw-tier-ci
  TARGET_BRANCH: master_candidate
  THALES_DASHBOARD_URL: https://riscv-ci.pages.thales-invia.fr/dashboard/dashboard_cva6.html
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    if: >-
      github.repository == 'AlexChenIC/cva6' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch ==
      'jchen/master-candidate-openhw-tier-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7

      - name: Checkout reviewed dashboard source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DASHBOARD_SOURCE_SHA }}
          path: candidate-dashboard-source

      - name: Install dashboard dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            jinja2==3.1.6 \
            pyyaml==6.0.3

      - name: Restore published dashboard data
        run: |
          set -euo pipefail
          mkdir -p \
            /tmp/legacy-data \
            /tmp/tier-data \
            /tmp/master-candidate-data \
            /tmp/legacy-persisted \
            /tmp/tier-persisted \
            /tmp/master-candidate-persisted
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1
            git archive origin/gh-pages data | tar -x -C /tmp/legacy-persisted
            cp -r /tmp/legacy-persisted/data/. /tmp/legacy-data/
          fi
          if git ls-remote --exit-code --heads origin gh-pages-cva6-tier-dashboard-data >/dev/null 2>&1; then
            git fetch origin gh-pages-cva6-tier-dashboard-data:refs/remotes/origin/gh-pages-cva6-tier-dashboard-data --depth=1
            git archive origin/gh-pages-cva6-tier-dashboard-data data | tar -x -C /tmp/tier-persisted
            cp -r /tmp/tier-persisted/data/. /tmp/tier-data/
          fi
          if git ls-remote --exit-code --heads origin gh-pages-master-candidate-dashboard-data >/dev/null 2>&1; then
            git fetch origin gh-pages-master-candidate-dashboard-data:refs/remotes/origin/gh-pages-master-candidate-dashboard-data --depth=1
            git archive origin/gh-pages-master-candidate-dashboard-data data | tar -x -C /tmp/master-candidate-persisted
            cp -r /tmp/master-candidate-persisted/data/. /tmp/master-candidate-data/
          fi

      - name: Collect existing dashboard data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/dashboard/collect_data.py --repo "${{ github.repository }}" --data-dir /tmp/legacy-data --fetch-count 10
          python3 .github/scripts/dashboard_tiers/collect_data.py --repo "${{ github.repository }}" --data-dir /tmp/tier-data --fetch-count 20

      - name: Collect master_candidate Tier data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 candidate-dashboard-source/.github/scripts/dashboard_tiers/collect_data.py --repo "${{ github.repository }}" --data-dir /tmp/master-candidate-data --fetch-count 20 --branch "$TIER_BRANCH" --base-branch "$TARGET_BRANCH"

      - name: Collect Thales GitLab reference
        run: |
          python3 candidate-dashboard-source/.github/scripts/dashboard_tiers/collect_thales_reference.py \
            --url "$THALES_DASHBOARD_URL" \
            --output /tmp/master-candidate-data/thales_reference.json

      - name: Test dashboard data handling
        run: python3 -m unittest discover --start-directory candidate-dashboard-source/.github/tests --pattern 'test_tier_dashboard.py'

      - name: Generate complete dashboard site
        run: |
          python3 .github/scripts/dashboard/generate_dashboard.py --data-dir /tmp/legacy-data --output-dir /tmp/dash-site --repo "${{ github.repository }}"
          python3 .github/scripts/dashboard_tiers/generate_dashboard.py --data-dir /tmp/tier-data --output-dir /tmp/dash-site/tier --repo "${{ github.repository }}"
          python3 candidate-dashboard-source/.github/scripts/dashboard_tiers/generate_dashboard.py --data-dir /tmp/master-candidate-data --output-dir /tmp/dash-site/master_candidate --repo "${{ github.repository }}"
          cp -r /tmp/legacy-data /tmp/dash-site/data
          cp -r /tmp/tier-data /tmp/dash-site/tier/data
          cp -r /tmp/master-candidate-data /tmp/dash-site/master_candidate/data
          printf '%s\n' '<!doctype html>' '<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./tier/"><title>Redirecting to Tier Dashboard</title></head><body><a href="./tier/">Tier Dashboard</a></body></html>' > /tmp/dash-site/tier.html
          touch /tmp/dash-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/dash-site

      - name: Upload dashboard preview
        uses: actions/upload-artifact@v7
        with:
          name: cva6-master-candidate-dashboard-overlay
          path: /tmp/dash-site/master_candidate
          retention-days: 14

      - name: Upload dashboard data for persistence
        uses: actions/upload-artifact@v7
        with:
          name: cva6-dashboard-data-snapshots
          path: |
            /tmp/legacy-data/
            /tmp/tier-data/
            /tmp/master-candidate-data/
          retention-days: 7

  deploy:
    if: github.repository == 'AlexChenIC/cva6'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}master_candidate/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  persist-data:
    name: Persist ${{ matrix.label }} Data
    if: github.repository == 'AlexChenIC/cva6'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Legacy dashboard
            branch: gh-pages
            source: legacy-data
          - label: Tier dashboard
            branch: gh-pages-cva6-tier-dashboard-data
            source: tier-data
          - label: master_candidate dashboard
            branch: gh-pages-master-candidate-dashboard-data
            source: master-candidate-data
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7

      - name: Prepare data branch
        env:
          DATA_BRANCH: ${{ matrix.branch }}
          DATA_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH" --depth=1
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf '# %s Data\n' "$DATA_LABEL" > README.md
            git add README.md
            git commit -m "Initialize $DATA_LABEL data"
          fi

      - name: Download data snapshot
        uses: actions/download-artifact@v8
        with:
          name: cva6-dashboard-data-snapshots
          path: /tmp/dashboard-data

      - name: Commit data update
        env:
          DATA_BRANCH: ${{ matrix.branch }}
          DATA_LABEL: ${{ matrix.label }}
          DATA_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          rm -rf data
          mkdir data
          cp -r "/tmp/dashboard-data/$DATA_SOURCE/." data/
          git add -A data/
          if git diff --cached --quiet; then
            echo "No $DATA_LABEL changes"
          else
            git commit -m "Update $DATA_LABEL data [skip ci]"
            git push origin "HEAD:$DATA_BRANCH"
          fi
