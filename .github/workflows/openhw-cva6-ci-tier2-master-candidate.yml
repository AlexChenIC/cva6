name: openhw-cva6-ci-tier2-master-candidate

on:
  push:
    branches:
      - master_candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhw-cva6-ci-tier2-master-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier2:
    uses: ./.github/workflows/openhw-cva6-ci-cook-tier-reusable.yml
    with:
      tier: tier2
