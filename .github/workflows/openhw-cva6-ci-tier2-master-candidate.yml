#
# Public RV32 AXI regression using the same cook.py target and testlist contract
# as the Thales matrix. The public backend is Verilator TestHarness + Spike,
# while Thales uses VCS/UVM. Zcmt remains deferred until the public runner gains
# a compatible LLVM 20 or GCC 15 toolchain. The effective compiler ISA is
# recorded in every artifact instead of being hidden in cva6.py target mapping.
# cv32a65x_axi base_pmp is also deferred until the public Spike/PMP behavior is
# resolved; the matrix-alignment artifact records that Thales covers it.
# Nightly scheduling is intentionally deferred to a default-branch dispatcher
# because GitHub schedules run only from the repository default branch.

name: openhw-cva6-ci-tier2-master-candidate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: openhw-cva6-ci-tier2-master-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_TANDEM: 1
  NUM_JOBS: 8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup-tools:
    name: Setup Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-tools: "true"

  execute-rv32-tier2:
    name: RV32 Tier2 ${{ matrix.config }} / ${{ matrix.testcase }}
    runs-on: ubuntu-latest
    needs: setup-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cv32a60x_axi
            testcase: base-rv32-p
            mode: cook-testlist
            simulator: veri-testharness,spike
            toolchain: github_actions_gcc
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            compiler_march: rv32imc_zba_zbb_zbs_zbc_zicsr
            compiler_march_reason: public-gcc-13.2-does-not-support-zcmt
            expected_hier: axi

          - config: cv32a65x_axi
            testcase: base-rv32-p
            mode: cook-testlist
            simulator: veri-testharness,spike
            toolchain: github_actions_gcc
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            compiler_march: rv32imc_zba_zbb_zbs_zbc_zicsr
            compiler_march_reason: public-gcc-13.2-does-not-support-zcmt
            expected_hier: axi

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-cook-dependencies: "true"

      - name: Install prerequisites
        run: source ci/install-prereq.sh

      - name: Run Tier 2
        env:
          TIER_NAME: Tier 2 master_candidate
          TIER_MODE: ${{ matrix.mode }}
          TIER_CONFIG: ${{ matrix.config }}
          TIER_TESTCASE: ${{ matrix.testcase }}
          TIER_SIMULATOR: ${{ matrix.simulator }}
          TIER_TOOLCHAIN: ${{ matrix.toolchain }}
          TIER_INSTALL_SCRIPT: ${{ matrix.install_script }}
          TIER_TESTLIST: ${{ matrix.testlist }}
          TIER_COMPILER_MARCH: ${{ matrix.compiler_march }}
          TIER_COMPILER_MARCH_REASON: ${{ matrix.compiler_march_reason }}
          TIER_EXPECTED_HIER: ${{ matrix.expected_hier }}
          TIER_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIER_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/run-tier-regression.sh

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## RV32 Tier 2"
            echo '```text'
            cat ci-results/metadata.txt 2>/dev/null || true
            cat ci-results/failure_summary.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-master-candidate-${{ matrix.config }}-${{ matrix.testcase }}
          path: |
            ci-results/
            artifacts/reports/
            build/${{ matrix.config }}/compile/
            build/${{ matrix.config }}/simulation/sim_verilator_testharness/
          if-no-files-found: warn
          retention-days: 14
