name: Cook Tier 1 live tandem
on:
  workflow_dispatch:
    inputs:
      profile_set:
        description: Supported Thales base lists or the preserved failing diagnostic matrix
        type: choice
        options: [supported, diagnostic]
        default: supported
      cold_tools:
        description: Rebuild tools without restoring or saving tool caches
        type: boolean
        default: false
  push:
    branches: [jchen/master-candidate-cook-tier1-live-tandem, master_candidate]
  pull_request:
    branches: [master_candidate]
permissions:
  contents: read
concurrency:
  group: cook-tier1-live-${{ github.ref }}
  cancel-in-progress: true
env:
  NUM_JOBS: '2'
  NO_COLOR: '1'
  TERM: dumb
jobs:
  contracts:
    name: Python orchestration contracts (not RTL tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install -c .github/cook/constraints.txt -r flows/requirements.txt
      - run: python3 -m unittest discover -s .github/cook/tests -v
  smoke:
    uses: ./.github/workflows/cook-testharness-smoke.yml
    with:
      cold_tools: ${{ inputs.cold_tools || false }}
  live:
    name: ${{ matrix.profile }} / ${{ inputs.profile_set || 'supported' }} / live Spike tandem
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        profile: [rv32, rv64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Record source and install Cook dependencies
        run: |
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/source-revision.txt
          git submodule status --recursive > ci-results/submodules.txt
          python3 -m pip install -c .github/cook/constraints.txt -r flows/requirements.txt
          python3 -m pip freeze > ci-results/python-packages.txt
      - uses: ./.github/cook/setup
        with:
          cold-tools: ${{ inputs.cold_tools || false }}
      - name: Check immediate CSR readback in real RTL (not ISA coverage)
        env:
          PROFILE: ${{ matrix.profile }}
          PROFILE_SET: ${{ inputs.profile_set || 'supported' }}
        run: |
          target=$(python3 -c 'import os,yaml; key="diagnostic_profiles" if os.environ["PROFILE_SET"]=="diagnostic" else "profiles"; print(yaml.safe_load(open(".github/cook/tier1.yml"))[key][os.environ["PROFILE"]]["target"])')
          python3 .github/cook/check_csr_readback.py --target "$target" --output ci-results/csr-readback
      - name: Prepare pinned test sources (not legacy execution flows)
        shell: bash
        env:
          PROFILE_SET: ${{ inputs.profile_set || 'supported' }}
        run: |
          set -eo pipefail
          source verif/regress/install-riscv-tests.sh
          git -C verif/tests/riscv-tests rev-parse HEAD > ci-results/riscv-tests-revision.txt
          git -C verif/tests/riscv-tests diff > ci-results/riscv-tests.patch
          if [ "$PROFILE_SET" = diagnostic ]; then
            source verif/regress/install-riscv-arch-test.sh
            git -C verif/tests/riscv-arch-test rev-parse HEAD > ci-results/riscv-arch-test-revision.txt
          fi
      - name: Cook compile, single run and live testlist
        env:
          CONFIG_DIR: ${{ github.workspace }}/ci-results/cook-config
          PROFILE: ${{ matrix.profile }}
          PROFILE_SET: ${{ inputs.profile_set || 'supported' }}
        run: |
          ulimit -c 0
          python3 .github/cook/prepare_toolchains.py --output-dir "$CONFIG_DIR" --tandem-enabled
          args=()
          if [ "$PROFILE_SET" = diagnostic ]; then args+=(--diagnostic); fi
          python3 .github/cook/run_tier1.py --profile "$PROFILE" "${args[@]}"
      - name: Upload available evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-tier1-live-${{ matrix.profile }}-${{ inputs.profile_set || 'supported' }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ci-results/
            !ci-results/csr-readback/obj/
            build/*/compile/
            build/*/simulation/
            build/*/elab/*/compilation.*
            build/*/elab/*/cook_manifest.yml
            build/*/elab/*/verilator.version
            build/*/elab/*/Variane_testharness
  acceptance:
    name: ${{ inputs.profile_set == 'diagnostic' && 'Diagnostic outcome (not Tier 1 acceptance)' || 'Cook Tier 1 acceptance' }}
    if: always()
    needs: [contracts, smoke, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          SMOKE: ${{ needs.smoke.result }}
          LIVE: ${{ needs.live.result }}
        run: |
          printf 'contracts=%s; smoke=%s; live=%s\n' "$CONTRACTS" "$SMOKE" "$LIVE" >> "$GITHUB_STEP_SUMMARY"
          test "$CONTRACTS" = success
          test "$SMOKE" = success
          test "$LIVE" = success
