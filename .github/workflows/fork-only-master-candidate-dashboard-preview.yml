name: fork-only-master-candidate-dashboard-preview

on:
  push:
    branches:
      - jchen/master-candidate-dashboard-preview-v1
    paths:
      - .github/scripts/dashboard/**
      - .github/scripts/dashboard_tiers/**
      - .github/tests/test_master_candidate_dashboard.py
      - .github/workflows/fork-only-master-candidate-dashboard-preview.yml
  workflow_dispatch:

concurrency:
  group: fork-only-master-candidate-dashboard-preview
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  MASTER_CANDIDATE_CI_BRANCH: jchen/master-candidate-tier-ci-master-adapter-v1

jobs:
  build:
    name: Build fork dashboard preview
    if: github.repository == 'AlexChenIC/cva6'
    runs-on: ubuntu-latest
    # Queue time counts toward this limit. Leave enough headroom for temporary
    # GitHub-hosted runner or Pages service degradation.
    timeout-minutes: 60
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Restore existing dashboard history
        run: |
          mkdir -p /tmp/legacy-data /tmp/tier-data /tmp/master-candidate-data

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git checkout origin/gh-pages -- data/ 2>/dev/null || true
            cp -r data/. /tmp/legacy-data/ 2>/dev/null || true
            rm -rf data
          fi

          if git ls-remote --exit-code --heads origin gh-pages-cva6-tier-dashboard-data >/dev/null 2>&1; then
            git fetch origin gh-pages-cva6-tier-dashboard-data --depth=1
            git checkout origin/gh-pages-cva6-tier-dashboard-data -- data/ 2>/dev/null || true
            cp -r data/. /tmp/tier-data/ 2>/dev/null || true
            rm -rf data
          fi

      - name: Collect current root dashboard data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/dashboard/collect_data.py \
            --repo "${{ github.repository }}" \
            --data-dir /tmp/legacy-data \
            --fetch-count 10

          python3 .github/scripts/dashboard_tiers/collect_data.py \
            --repo "${{ github.repository }}" \
            --data-dir /tmp/tier-data \
            --fetch-count 20

      - name: Collect master candidate data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/dashboard_tiers/collect_data.py \
            --repo "${{ github.repository }}" \
            --data-dir /tmp/master-candidate-data \
            --fetch-count 20 \
            --branch "$MASTER_CANDIDATE_CI_BRANCH" \
            --workflows tier1 tier2

      - name: Install dashboard dependency
        run: python3 -m pip install --disable-pip-version-check jinja2==3.1.6

      - name: Run dashboard tests
        run: |
          python3 -m unittest discover \
            --start-directory .github/tests \
            --pattern 'test_master_candidate_dashboard.py'

      - name: Generate complete Pages preview
        run: |
          python3 .github/scripts/dashboard/generate_dashboard.py \
            --data-dir /tmp/legacy-data \
            --output-dir /tmp/dash-site \
            --repo "${{ github.repository }}"

          python3 .github/scripts/dashboard_tiers/generate_dashboard.py \
            --data-dir /tmp/tier-data \
            --output-dir /tmp/dash-site/tier \
            --repo "${{ github.repository }}"

          python3 .github/scripts/dashboard_tiers/generate_dashboard.py \
            --data-dir /tmp/master-candidate-data \
            --output-dir /tmp/dash-site/master-candidate \
            --repo "${{ github.repository }}" \
            --profile master-candidate \
            --page-title "CVA6 master_candidate Tier CI Dashboard" \
            --dashboard-title "CVA6 master_candidate Tier CI" \
            --branch-label "$MASTER_CANDIDATE_CI_BRANCH" \
            --back-link "../" \
            --notice "Fork-only preview. Results are filtered to the branch shown above and do not represent upstream acceptance."

          cp -r /tmp/legacy-data /tmp/dash-site/data
          cp -r /tmp/tier-data /tmp/dash-site/tier/data
          cp -r /tmp/master-candidate-data /tmp/dash-site/master-candidate/data

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./master-candidate/">' \
            '<title>Master candidate dashboard</title></head>' \
            '<body><a href="./master-candidate/">Open master candidate dashboard</a></body></html>' \
            > /tmp/dash-site/master-candidate.html

      - name: Upload inspectable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-master-candidate-dashboard-preview
          path: /tmp/dash-site
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/dash-site

  deploy:
    name: Deploy fork Pages preview
    needs: build
    if: github.repository == 'AlexChenIC/cva6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}master-candidate/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
