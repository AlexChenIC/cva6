# ================================================================================
# OpenHW CVA6 CI - Tier 1: Fast Verilator Sanity
# ================================================================================
#
# PURPOSE:
#   Provide bounded regression feedback using existing Cook recipes to compile
#   and run upstream tests on the Verilator TestHarness with live Spike tandem.
#   Cook records software completion, comparison results and failures.
#
# TRIGGER POLICY:
#   push              -> Check updates to master_candidate.
#   pull_request      -> Check PRs targeting master_candidate.
#   workflow_dispatch -> On-demand rerun for manual validation.
#
# COVERED CONFIGURATIONS AND TESTS:
#   Shared matrix for push, PR and manual runs:
#     rv32-60x -> cv32a60x_axi:      basic (5) + integer-extra (3).
#     rv32-65x -> cv32a65x_sv32_axi: basic (5) + integer-extra (3).
#     rv64 -> cv64a6_imac_sv39_hpdcache_pmp_nommu_axi_zcmt:
#             basic (1): alu_chain_test.
#   These selections reuse the upstream test sources and startup. This is a
#   bounded integer regression, not the complete instruction/feature coverage.
#
# CONFIGURATION AND RESULTS:
#   .github/cook/prepare_testlists.py -> REGRESSION_CONFIG selects tests/targets.
#   .github/cook/run-tier-regression.py -> Calls the existing Cook recipes.
#   build/**/cook_report.yml -> Per-recipe results and the runner's verdict.
#   artifacts/reports/pipeline_report.{html,yml} -> Unified Cook reports.
#   ci-results/ -> Testlists, provenance, command logs, checkout SHA and submodule IDs.
#   Artifacts retain diagnostic logs, native tandem YAML, Spike target configs,
#   live filelists and tool versions; binaries, waveforms and disassembly are omitted.
# ================================================================================

name: RV64 model A-B-A diagnostic

on:
  push:
    branches: [master_candidate]
  pull_request:
    branches: [master_candidate]
  # Dispatch requires this workflow on the repository's default branch.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openhw-cva6-ci-tier1-${{ github.ref }}
  cancel-in-progress: true
env:
  NUM_JOBS: "2"
  NO_COLOR: "1"
  TERM: dumb
jobs:
  execute-tier1:
    name: Diagnostic / ${{ matrix.profile }} / live Spike
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # All triggers use these entries from REGRESSION_CONFIG.profiles.
        include:
          - profile: rv64
    steps:
      # ============================================================
      # Step 1: Prepare source, verification dependencies and tools
      # ============================================================
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record source
        run: |
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/source-revision.txt
          git submodule status --recursive > ci-results/submodules-before.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Cook dependencies
        run: |
          python3 -m pip install -c .github/cook/constraints.txt -r flows/requirements.txt
          python3 -m pip freeze > ci-results/python-packages.txt
      - name: Prepare verification dependencies and submodule patches
        run: |
          set -o pipefail
          env -u CONFIG_DIR python3 cook.py git-dependencies 2>&1 | tee ci-results/prepare-dependencies.log
          git submodule status --recursive > ci-results/submodules-after.txt
      - name: Prepare tools
        uses: ./.github/cook/setup

      # ============================================================
      # Step 2: Run the selected regression through Cook
      # ============================================================
      - name: Run selected live tests
        id: regression
        env:
          CONFIG_DIR: ${{ github.workspace }}/ci-results/cook-config
          PROFILE: ${{ matrix.profile }}
          # Initial finite setting for the live model's observed 16 MiB stack overflow.
          # Tune with runtime evidence and requirement, this is not a measured minimum.
          TANDEM_STACK_KIB: "262144"
        run: |
          set -e -o pipefail
          # Same-shell setting: inherited by software/model compilation and simulation
          # in this step. Independent steps and Hello/ordinary workflows are unchanged.
          stack_log="ci-results/stack-limit.log"
          stack_soft_before=$(ulimit -S -s)
          stack_hard_before=$(ulimit -H -s)
          printf 'requested_kib=%s\nbefore_soft_kib=%s\nbefore_hard_kib=%s\n' \
            "$TANDEM_STACK_KIB" "$stack_soft_before" "$stack_hard_before" | tee "$stack_log"
          if [[ ! "$TANDEM_STACK_KIB" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::TANDEM_STACK_KIB must be a positive finite integer" | tee -a "$stack_log"
            exit 1
          fi
          if [[ "$stack_soft_before" != unlimited ]] && [ "$stack_soft_before" -lt "$TANDEM_STACK_KIB" ]; then
            if ! ulimit -S -s "$TANDEM_STACK_KIB"; then
              echo "::error::Cannot set tandem stack soft limit; check the hard limit" | tee -a "$stack_log"
              exit 1
            fi
          fi
          printf 'after_soft_kib=%s\nafter_hard_kib=%s\n' "$(ulimit -S -s)" "$(ulimit -H -s)" | tee -a "$stack_log"
          python3 - <<'PY_STACK' | tee -a "$stack_log"
          import os
          import resource
          soft, hard = resource.getrlimit(resource.RLIMIT_STACK)
          print(f"child_soft_bytes={soft} child_hard_bytes={hard} (-1=unlimited)")
          if soft != resource.RLIM_INFINITY and soft < int(os.environ["TANDEM_STACK_KIB"]) * 1024:
              raise SystemExit("Tandem stack limit was not inherited")
          PY_STACK
          python3 .github/cook/prepare_toolchains.py --output-dir "$CONFIG_DIR" --tandem-enabled
          # Validation branch only: compile once, compare original/variant/restored.
          python3 - <<'PY_AB'
          import copy
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          import yaml

          sys.path.insert(0, str(Path(".github/cook").resolve()))
          from prepare_testlists import REGRESSION_CONFIG
          from run_smoke import checked_report, read_yaml, run_logged, sha256

          root = Path.cwd()
          out = root / "ci-results/model-ab"
          out.mkdir(parents=True, exist_ok=True)
          target = REGRESSION_CONFIG["profiles"][os.environ["PROFILE"]]["target"]
          test = "alu_chain_test_0"
          build = root / "build" / target
          mode = "sim_rtl_verilator_testharness_tandem"
          model = build / "elab" / mode / "Variane_testharness"
          elf = build / "compile" / test / (test + ".elf")
          config = root / "config/target" / target / "spike.yaml"
          original = config.read_bytes()
          needle = b"extensions: cv32a60x,cvxif"
          assert original.count(needle) == 1
          variant = original.replace(needle, b"extensions: cv32a60x")
          expected = copy.deepcopy(yaml.safe_load(original))
          expected["spike_param_tree"]["core_configs"][0]["extensions"] = "cv32a60x"
          assert yaml.safe_load(variant) == expected
          (out / "A-spike.yaml").write_bytes(original)
          (out / "B-spike.yaml").write_bytes(variant)
          result = {
              "purpose": "Diagnostic A/B/A, not production Tier 1 acceptance",
              "source_revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "target": target,
              "test": test,
              "only_model_change": "Remove cvxif plugin registration; keep live and all comparison checks",
              "cases": [],
          }
          def save():
              (out / "result.json").write_text(json.dumps(result, indent=2))
          def run(label, command, directory):
              print("Diagnostic", label, ":", " ".join(command), flush=True)
              rc, timed_out = run_logged(command, cwd=root, env=os.environ.copy(),
                                         log=out / (label + "-driver.log"), timeout=None)
              native = read_yaml(directory / "testharness.log.yaml")
              cook = read_yaml(directory / "cook_report.yml")
              text = (directory / "testharness.log").read_text()
              row = {
                  "label": label, "exit_code": rc, "timed_out": timed_out,
                  "native_report": str(directory / "testharness.log.yaml"),
                  "cook_status": cook.get("status"), "tandem_enabled": cook["context"]["tandem_enabled"],
                  "instr_count": native.get("instr_count"), "csrs_match_count": native.get("csrs_match_count"),
                  "mismatches_count": native.get("mismatches_count"), "exit_cause": native.get("exit_cause"),
                  "native_exit_code": native.get("exit_code"),
                  "software_success": "*** SUCCESS *** (tohost = 0)" in text,
                  "config_sha256": sha256(config),
              }
              first = native.get("mismatches")
              if first:
                  pair = next(iter(first[0].values()))
                  row["first_mismatch"] = pair
              result["cases"].append(row)
              save()
              assert not timed_out and row["tandem_enabled"] is True
              assert isinstance(row["instr_count"], int) and row["instr_count"] > 0
              return row

          try:
              a = run("A_original", [sys.executable, ".github/cook/run-tier-regression.py",
                      "--profile", os.environ["PROFILE"]], build / "simulation" / mode / test)
              checked_report(build / "compile/rv64-basic", "sw-compile-testlist", "software")
              checked_report(build / "elab" / mode, "verilator-testharness-comp", "model")
              result["build_identity_before"] = {"model_sha256": sha256(model), "elf_sha256": sha256(elf)}
              save()
              assert a["exit_code"] != 0 and a["cook_status"] == "fail" and a["exit_cause"] == "MISMATCH"
              assert a["mismatches_count"] > 0 and a["first_mismatch"]["core"]["insn_disasm"].startswith("c.sd ")
              common = [sys.executable, "cook.py", "verilator-testharness-run", "-t", target,
                        "-n", test, "--tandem-enabled", "--quiet", "--run-name"]
              config.write_bytes(variant)
              b = run("B_without_cvxif", common + ["alu_without_cvxif"],
                      build / "simulation" / mode / "alu_without_cvxif")
              config.write_bytes(original)
              restored = run("A_restored", common + ["alu_restored_cvxif"],
                             build / "simulation" / mode / "alu_restored_cvxif")
              result["build_identity_after"] = {"model_sha256": sha256(model), "elf_sha256": sha256(elf)}
              assert result["build_identity_before"] == result["build_identity_after"]
              assert restored["exit_code"] != 0 and restored["cook_status"] == "fail"
              assert restored["exit_cause"] == "MISMATCH" and restored["mismatches_count"] == a["mismatches_count"]
              assert restored["instr_count"] == a["instr_count"]
              assert restored["first_mismatch"] == a["first_mismatch"]
              result["B_positive_live"] = (
                  b["exit_code"] == 0 and b["cook_status"] == "pass" and b["software_success"]
                  and b["mismatches_count"] == 0 and b["exit_cause"] == "SUCCESS"
                  and b["native_exit_code"] == 0
              )
              result["expected_ABA_observed"] = result["B_positive_live"]
              if not result["expected_ABA_observed"]:
                  raise SystemExit("Variant did not pass; retain all original failures for analysis")
          finally:
              config.write_bytes(original)
              result["original_config_restored"] = config.read_bytes() == original
              save()
          print(json.dumps(result, indent=2), flush=True)
          PY_AB

      # ============================================================
      # Step 3: Generate reports and upload available results, even on failure
      # ============================================================
      - name: Render unified Cook reports
        if: always()
        env:
          # Reuse Cook's CI_* metadata contract without its master-only GitHub wrapper.
          CI_PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PIPELINE_SOURCE: ${{ github.event_name }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
        run: |
          export CI_COMMIT_SHA="$(git rev-parse HEAD)"
          export CI_COMMIT_MESSAGE="$(git log -1 --format=%s)"
          export CI_COMMIT_AUTHOR="$(git log -1 --format='%an <%ae>')"
          python3 cook.py merge-reports --quiet
          python3 cook.py report-html --quiet
      - name: Upload available evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-regression-${{ matrix.profile }}
          retention-days: 14
          if-no-files-found: error
          # Keep reports and diagnostics without archiving complete build directories.
          # Native tandem YAML needs its own pattern; spike_dasm.log is a trace.
          path: |
            ci-results/
            artifacts/reports/pipeline_report.html
            artifacts/reports/pipeline_report.yml
            config/target/*/spike.yaml
            build/**/cook_report.yml
            build/**/cook_manifest.yml
            build/**/*.log
            build/**/testharness.log.yaml
            build/**/compilation.command
            build/**/Flist.live
            build/**/verilator.version
            !build/**/spike_dasm.log

      - name: Summarize diagnostic cases
        if: always()
        run: |
          python3 - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          path = Path("ci-results/model-ab/result.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### RV64 model A/B/A diagnostic\n\n")
              summary.write("Same ELF and RTL model; only Spike cvxif plugin registration changes. "
                            "Expected baseline failures remain in Cook reports. This is not Tier 1 acceptance.\n\n")
              if path.exists():
                  result = json.loads(path.read_text())
                  summary.write(f"**Core:** {result['target']}\n\n")
                  summary.write("| Case | Cook | Comparisons | Mismatches | End |\n|---|---|---:|---:|---|\n")
                  for row in result["cases"]:
                      summary.write(f"| {row['label']} | {row['cook_status']} | {row['instr_count']} | "
                                    f"{row['mismatches_count']} | {row['exit_cause']} |\n")
              else:
                  summary.write("No diagnostic result: inspect the failed preparation step.\n")
          PY_SUMMARY
