# SPDX-License-Identifier: Apache-2.0
# Keep the registered workflow path; this first stage is a single RTL-only smoke.
name: Cook Verilator TestHarness smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [master_candidate]
permissions:
  contents: read
concurrency:
  group: cook-testharness-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  NUM_JOBS: '2'
  NO_COLOR: '1'
  TERM: dumb
jobs:
  hello-world:
    name: cv32a65x_axi / Hello World / RTL-only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record source
        run: |
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/source-revision.txt
          git submodule status --recursive > ci-results/submodules.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cook dependencies
        run: python3 -m pip install -c .github/requirements/cook-tier-ci-constraints.txt -r flows/requirements.txt
      - name: Recipe and smoke contract tests
        run: |
          python3 .github/tests/test_logged_process.py -v
          python3 .github/tests/test_verilator_testharness_comp.py -v
          python3 .github/tests/test_verilator_testharness_run.py -v
          python3 .github/tests/test_testharness_run_testlist.py -v
          python3 .github/tests/test_cook_testharness_smoke.py -v
      - uses: ./.github/actions/setup-cva6-env
        with:
          verilator-version: '5.050'
          install-cook-dependencies: 'false'
      - name: Compile and run Hello World
        env:
          SMOKE_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/run-testharness-smoke.sh
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-testharness-smoke-cv32a65x_axi
          retention-days: 14
          if-no-files-found: error
          path: |
            ci-results/
            build/cv32a65x_axi/compile/hello-world_0/
            build/cv32a65x_axi/simulation/
            build/cv32a65x_axi/elab/sim_rtl_verilator_testharness/compilation.*
            build/cv32a65x_axi/elab/sim_rtl_verilator_testharness/cook_manifest.yml
            build/cv32a65x_axi/elab/sim_rtl_verilator_testharness/verilator.version
