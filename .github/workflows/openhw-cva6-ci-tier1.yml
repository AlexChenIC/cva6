# Cook/Verilator sanity checks plus frozen self-checking ACT4 for master_candidate AXI targets.

name: openhw-cva6-ci-tier1

on:
  pull_request:
    branches:
      - master_candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhw-cva6-ci-tier1-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_TANDEM: 1
  NUM_JOBS: 8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup-tools:
    name: Setup Tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # ACT4 provenance tests prove that the locked CVA6 baseline is an
          # ancestor of the checked-out revision; a depth-1 clone cannot make
          # that claim once this integration gains its first commit.
          fetch-depth: 0
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-tools: "true"
          install-cook-dependencies: "true"

      - name: Test Verilator TestHarness result handling
        run: python3 .github/tests/test_verilator_testharness_safety.py -v

      - name: Test ACT4 frozen-corpus safety
        run: python3 -m unittest discover -s .github/tests -p 'test_act4_*.py' -v

  execute-rv32-tier1:
    name: RV32 Tier1 ${{ matrix.config }} / ${{ matrix.testcase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: setup-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cv32a60x_axi
            testcase: base-rv32-p
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc

          - config: cv32a65x_axi
            testcase: base-rv32-p
            install_script: install-riscv-tests
            testlist: verif/tests/base_rv32_p.yaml
            compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-cook-dependencies: "true"

      - name: Install simulation prerequisites
        run: source ci/install-prereq.sh

      - name: Run Tier 1 for ${{ matrix.config }} / ${{ matrix.testcase }}
        env:
          TIER_NAME: Tier 1
          TIER_MODE: cook-testlist
          TIER_CONFIG: ${{ matrix.config }}
          TIER_TESTCASE: ${{ matrix.testcase }}
          TIER_INSTALL_SCRIPT: ${{ matrix.install_script }}
          TIER_TESTLIST: ${{ matrix.testlist }}
          TIER_COMPILER_MARCH: ${{ matrix.compiler_march }}
          TIER_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIER_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/run-tier-regression.sh

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-rv32-${{ matrix.config }}-${{ matrix.testcase }}
          path: |
            ci-results/
            artifacts/reports/
            build/${{ matrix.config }}/compile/
            build/${{ matrix.config }}/simulation/sim_verilator_testharness/
            build/${{ matrix.config }}/config/
          if-no-files-found: error
          retention-days: 14

  execute-cv32a65x-axi-act4-tier1:
    name: RV32 Tier1 cv32a65x_axi / ACT4 frozen corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: setup-tools

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-cook-dependencies: "true"

      - name: Install simulation prerequisites
        run: source ci/install-prereq.sh

      - name: Run cv32a65x_axi ACT4 frozen corpus
        env:
          # ACT4 ELFs are self-checking. Keep the global tandem setting out of
          # both the TestHarness build and runtime; FESVR is still a link-time
          # dependency supplied by the cached Spike installation.
          SPIKE_TANDEM: ""
          TIER_NAME: Tier 1 ACT4
          TIER_MODE: act4-prebuilt
          TIER_CONFIG: cv32a65x_axi
          TIER_ACT4_CORPUS: verif/tests/act4/cv32a65x_axi/corpus
          TIER_ACT4_CYCLE_TIMEOUT: 10000000
          TIER_ACT4_WALL_TIMEOUT_SECONDS: 300
          TIER_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIER_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: bash .github/scripts/run-tier-regression.sh

      - name: Upload ACT4 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-act4-cv32a65x-axi
          path: |
            ci-results/
            artifacts/act4/
            artifacts/reports/
          if-no-files-found: error
          retention-days: 14
