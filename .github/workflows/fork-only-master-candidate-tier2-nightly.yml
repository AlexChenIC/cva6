name: fork-only-master-candidate-tier2-nightly

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: fork-only-master-candidate-tier2-nightly
  cancel-in-progress: false

env:
  TIER_BRANCH: jchen/master-candidate-openhw-tier-ci

jobs:
  dispatch:
    if: github.repository == 'AlexChenIC/cva6'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch master_candidate Tier 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/openhw-cva6-ci-tier2.yml/dispatches" \
            --field "ref=$TIER_BRANCH"
