deferred:
  original_p_mode: The existing riscv-tests p-mode startup writes PMP CSRs and transitions privilege. Keep it as a strict diagnostic until the shared CSR/RVFI issues are resolved; adapted M-mode PASS is not original p-mode acceptance.
  non_sv32_65x: cv32a65x_axi rejects NAPOT PMP writes while vendor Spike accepts them. Keep strict diagnostics; no WARL masking or RTL change is used to hide it.
  zcmt: Historical Thales cv32a65x_axi base_zcmt jobs fail; same root cause not proven. Diagnostics only pending native evidence.
  pmp: Dedicated cv32a65x_axi PMP list needs strict native validation; historical dashboard PASS alone is insufficient.
  legacy: No full legacy ci.yml equivalence, offline comparison, WB, OBI, VM or architecture acceptance is claimed.
  operations: No automatic nightly or dashboard; upstream deployment requires maintainer acceptance.
