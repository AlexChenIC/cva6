# Original riscv-tests instruction bodies with the bounded Cook M-mode environment.
# Not equivalent to the original p-mode privilege/PMP coverage.
common: &common
  iterations: 1
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -mno-relax -I.github/cook/env/m/ -I<path_var>/riscv-tests/isa/macros/scalar/"
testlist:
  - test: rv32um-m-stage1-div
    <<: *common
    asm_tests: <path_var>/riscv-tests/isa/rv32um/div.S
  - test: rv32um-m-stage1-rem
    <<: *common
    asm_tests: <path_var>/riscv-tests/isa/rv32um/rem.S
  - test: rv32um-m-stage1-mulh
    <<: *common
    asm_tests: <path_var>/riscv-tests/isa/rv32um/mulh.S
