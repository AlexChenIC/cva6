name: Setup ACT4 Environment
description: Install the pinned ACT4 generator, compiler, and Sail dependencies

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.7"
        enable-cache: "true"
        cache-dependency-glob: external/act4/uv.lock

    - name: Setup Ruby and Bundler
      uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1, 2026-07-02
      with:
        ruby-version: "3.4.9"
        bundler: Gemfile.lock
        bundler-cache: "true"
        working-directory: external/act4/framework/src/act/data

    - name: Cache ACT4 GCC
      id: cache-act4-gcc
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: tools/act4-gcc/
        key: ${{ runner.os }}-${{ runner.arch }}-act4-gcc-xpack-15.2.0-1

    - name: Install ACT4 GCC
      if: steps.cache-act4-gcc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/act4-gcc.tar.gz"
        mkdir -p tools/act4-gcc
        curl --fail --location --retry 3 \
          --output "${archive}" \
          https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz
        echo "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758  ${archive}" | sha256sum -c -
        tar -xzf "${archive}" --strip-components=1 -C tools/act4-gcc

    - name: Configure ACT4 GCC aliases
      shell: bash
      run: |
        set -euo pipefail
        alias_dir="${GITHUB_WORKSPACE}/tools/act4-gcc/aliases"
        mkdir -p "${alias_dir}"
        for tool in addr2line ar as c++ c++filt cpp elfedit g++ gcc gcc-ar gcc-nm gcc-ranlib gcov gcov-dump gcov-tool gdb gdb-add-index gprof ld ld.bfd lto-dump nm objcopy objdump ranlib readelf size strings strip; do
          source_path="${GITHUB_WORKSPACE}/tools/act4-gcc/bin/riscv-none-elf-${tool}"
          if [[ -x "${source_path}" ]]; then
            ln -sfn "../bin/riscv-none-elf-${tool}" "${alias_dir}/riscv64-unknown-elf-${tool}"
          fi
        done
        "${alias_dir}/riscv64-unknown-elf-gcc" -dumpfullversion
        echo "ACT4_GCC_ALIAS_DIR=${alias_dir}" >> "${GITHUB_ENV}"
        echo "${alias_dir}" >> "${GITHUB_PATH}"
        echo "${GITHUB_WORKSPACE}/tools/act4-gcc/bin" >> "${GITHUB_PATH}"

    - name: Cache ACT4 Sail
      id: cache-act4-sail
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: tools/act4-sail/
        key: ${{ runner.os }}-${{ runner.arch }}-act4-sail-riscv-0.10

    - name: Install ACT4 Sail
      if: steps.cache-act4-sail.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/act4-sail.tar.gz"
        mkdir -p tools/act4-sail
        curl --fail --location --retry 3 \
          --output "${archive}" \
          https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-Linux-x86_64.tar.gz
        echo "cb66af6efb5d1ebb812cf19ca2156c2b1020881f08f16c40136da7e84af299ca  ${archive}" | sha256sum -c -
        tar -xzf "${archive}" --strip-components=1 -C tools/act4-sail

    - name: Configure ACT4 Sail
      shell: bash
      run: |
        set -euo pipefail
        sail_bin_dir="${GITHUB_WORKSPACE}/tools/act4-sail/bin"
        "${sail_bin_dir}/sail_riscv_sim" --version
        echo "ACT4_SAIL_BIN_DIR=${sail_bin_dir}" >> "${GITHUB_ENV}"
        echo "${sail_bin_dir}" >> "${GITHUB_PATH}"
