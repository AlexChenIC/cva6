schema_version: 1

comparison:
  source: .gitlab-ci.yml
  matrix_key: .testlist_matrix_target
  public_backend: Verilator TestHarness with Spike tandem
  thales_backend: VCS/UVM with Spike tandem

scope:
  targets:
    - cv32a60x_axi
    - cv32a65x_axi

tiers:
  tier1:
    expected_enabled_tests: 10
    expected_required_enabled_tests: 10
    expected_diagnostic_enabled_tests: 0
    entries:
      - target: cv32a60x_axi
        testlist: verif/tests/base_rv32_p.yaml
        expected_enabled_tests: 5
        acceptance: required
        toolchain: github_actions_gcc
        install_script: install-riscv-tests
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc
        compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
        expected_hier: axi
      - target: cv32a65x_axi
        testlist: verif/tests/base_rv32_p.yaml
        expected_enabled_tests: 5
        acceptance: required
        toolchain: github_actions_gcc
        install_script: install-riscv-tests
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei
        compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
        expected_hier: axi

  tier2:
    expected_enabled_tests: 23
    expected_required_enabled_tests: 10
    expected_diagnostic_enabled_tests: 13
    entries:
      - target: cv32a60x_axi
        testlist: verif/tests/base_rv32_p.yaml
        expected_enabled_tests: 5
        acceptance: required
        toolchain: github_actions_gcc
        install_script: install-riscv-tests
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc
        compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
        expected_hier: axi
      - target: cv32a60x_axi
        testlist: verif/tests/base_zcmt.yaml
        expected_enabled_tests: 4
        acceptance: diagnostic
        acceptance_reason: target-zifencei-contract-under-review
        toolchain: github_actions_llvm18
        install_script: ""
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zcmt
        compiler_march_reason: llvm-18-provides-zcmt-assembly-support
        expected_hier: axi
      - target: cv32a65x_axi
        testlist: verif/tests/base_rv32_p.yaml
        expected_enabled_tests: 5
        acceptance: required
        toolchain: github_actions_gcc
        install_script: install-riscv-tests
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei
        compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
        expected_hier: axi
      - target: cv32a65x_axi
        testlist: verif/tests/base_zcmt.yaml
        expected_enabled_tests: 4
        acceptance: diagnostic
        acceptance_reason: target-spike-privilege-contract-under-review
        toolchain: github_actions_llvm18
        install_script: ""
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zcmt_zifencei
        compiler_march_reason: llvm-18-provides-zcmt-assembly-support
        expected_hier: axi
      - target: cv32a65x_axi
        testlist: verif/tests/base_pmp.yaml
        expected_enabled_tests: 5
        acceptance: diagnostic
        acceptance_reason: spike-pmp-granularity-contract-under-review
        toolchain: github_actions_gcc
        install_script: ""
        compiler_march: rv32imc_zicsr_zba_zbb_zbs_zbc_zifencei
        compiler_march_reason: public-gcc-13.2-does-not-accept-zcmt
        expected_hier: axi
